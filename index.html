<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1b1e4f">
  <title>Vehicle Position · Daman Group</title>
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Vehicle Tracker">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="top-in">
      <a class="brand" href="#board" data-view="board">
        <img src="logo.webp" alt="Daman Group logo">
        <span class="brand-txt"><b>DAMAN GROUP</b><small>Vehicle Position Tracker</small></span>
      </a>
      <nav class="tabs" aria-label="Sections">
        <button type="button" data-view="board" class="active">Board</button>
        <button type="button" data-view="programs">Programs <span class="tab-badge" data-badge hidden></span></button>
        <button type="button" data-view="print">Print</button>
      </nav>
      <div class="top-right">
        <span id="saveState" class="save-state" hidden></span>
        <button type="button" class="calls-btn" id="callsBtn" title="Caller-wise pending calls">
          <svg class="ico" viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>
          <span class="lbl">Pending calls</span><span class="cnt" id="callsCount">–</span>
        </button>
        <button type="button" class="sync" id="syncBtn" title="Reload from Google Sheet">
          <span class="dot"></span><span id="syncText">Loading…</span>
          <svg class="ico spin-on-load" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
        </button>
        <button type="button" class="user-chip" id="userBtn" title="Change user">
          <svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
          <span class="initial" id="userInitial">?</span>
          <span id="userName">Who?</span>
        </button>
      </div>
    </div>
    <div class="road" aria-hidden="true"></div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <!-- "install as an app" strip — shown only when the browser allows installing -->
  <div id="installBar" class="install-bar" hidden>
    <img src="icon-192.png" alt="">
    <span class="ib-txt"><b>Install the app</b><small id="installHow">Opens like an app from your home screen</small></span>
    <button type="button" class="btn primary sm" id="installBtn">Install</button>
    <button type="button" class="ib-x" id="installClose" aria-label="Not now">×</button>
  </div>

  <main>
    <!-- ============ BOARD ============ -->
    <section id="view-board" class="view">
      <div class="callers" id="callerChips" aria-label="Caller"></div>

      <div class="toolbar">
        <label class="search">
          <svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" type="search" placeholder="Search vehicle, driver, location, remark…" autocomplete="off">
        </label>
        <div class="tb-right">
          <label class="select-wrap" title="Group by">
            <span>View</span>
            <select id="groupBy">
              <option value="status">By status</option>
              <option value="location">By location</option>
              <option value="caller">By caller</option>
              <option value="table">Table</option>
            </select>
          </label>
          <button type="button" class="btn ghost" id="filterBtn" aria-expanded="false">
            <svg class="ico" viewBox="0 0 24 24"><path d="M3 5h18M6 12h12M10 19h4"/></svg>
            Filters <span class="count-pill" id="filterCount" hidden></span>
          </button>
        </div>
      </div>

      <div class="filters" id="filters" hidden>
        <div class="f-row">
          <span class="f-lbl">Status</span>
          <div class="chips" id="catChips"></div>
        </div>
        <div class="f-grid">
          <label>Current location<select id="fLoc"><option value="">All locations</option></select></label>
          <label>Item<select id="fItem"><option value="">All items</option></select></label>
          <label>Program<select id="fProg">
            <option value="">All</option>
            <option value="need">Needs program</option>
            <option value="given">Program given – driver not told</option>
            <option value="informed">Driver informed</option>
          </select></label>
        </div>
        <div class="f-row">
          <span class="f-lbl">Show only</span>
          <div class="chips">
            <button type="button" class="chip" data-flag="upd">Just updated</button>
            <button type="button" class="chip" data-flag="late">Late</button>
            <button type="button" class="chip" data-flag="due">Follow-up due</button>
            <button type="button" class="chip" data-flag="stale">Not called today</button>
            <button type="button" class="chip" data-flag="nodrv">No driver details</button>
          </div>
          <button type="button" class="btn link" id="resetFilters">Reset all</button>
        </div>
      </div>

      <div class="kpis" id="kpis"></div>
      <div class="result-line" id="resultLine"></div>
      <div id="boardList" class="board-list"></div>
    </section>

    <!-- ============ PROGRAMS ============ -->
    <section id="view-programs" class="view" hidden>
      <div class="callers" id="callerChips2" aria-label="Caller"></div>
      <div class="prog-head">
        <div class="seg" id="progSeg" role="tablist"></div>
        <label class="search small">
          <svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="pq" type="search" placeholder="Search vehicle / location" autocomplete="off">
        </label>
      </div>
      <p class="hint" id="progHint"></p>
      <div id="progList" class="prog-list"></div>
    </section>

    <!-- ============ PRINT ============ -->
    <section id="view-print" class="view" hidden>
      <div class="print-controls">
        <div class="seg" id="repSeg">
          <button type="button" data-rep="caller" class="on">Caller wise</button>
          <button type="button" data-rep="un">U&amp;N</button>
          <button type="button" data-rep="lr">L&amp;R</button>
          <button type="button" data-rep="rh">R&amp;H</button>
        </div>
        <div class="pc-opts">
          <label>Caller<select id="repCaller"></select></label>
          <label>Page<select id="repOrient">
            <option value="auto">Auto</option>
            <option value="portrait">Portrait</option>
            <option value="landscape">Landscape</option>
          </select></label>
          <label>Columns<select id="repCols">
            <option value="auto">Auto</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
          </select></label>
          <div class="out-btns">
            <button type="button" class="btn primary" id="printBtn">
              <svg class="ico" viewBox="0 0 24 24"><path d="M6 9V3h12v6M6 18H4a1 1 0 0 1-1-1v-6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6a1 1 0 0 1-1 1h-2M6 14h12v7H6z"/></svg>
              Print
            </button>
            <button type="button" class="btn navy" id="pdfBtn" title="Download as a PDF file">
              <svg class="ico" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
              <span>PDF</span>
            </button>
            <button type="button" class="btn navy" id="jpgBtn" title="Download each page as a JPG picture">
              <svg class="ico" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
              <span>JPG</span>
            </button>
          </div>
        </div>
        <p class="hint" id="repHint" hidden></p>
      </div>
      <div id="printArea" class="print-area"></div>
    </section>
  </main>

  <!-- bottom navigation (phones) -->
  <nav class="bottom-nav" aria-label="Sections">
    <button type="button" data-view="board" class="active">
      <svg class="ico" viewBox="0 0 24 24"><path d="M3 7h11v8H3zM14 10h4l3 3v2h-7M6.5 18.5a1.5 1.5 0 1 0 0-.01M17.5 18.5a1.5 1.5 0 1 0 0-.01"/></svg>
      <span>Board</span>
    </button>
    <button type="button" data-view="programs">
      <svg class="ico" viewBox="0 0 24 24"><path d="M9 4h6v3H9zM7 5H5v16h14V5h-2M8 12l2.5 2.5L16 9"/></svg>
      <span>Programs</span><span class="tab-badge" data-badge hidden></span>
    </button>
    <button type="button" data-view="print">
      <svg class="ico" viewBox="0 0 24 24"><path d="M6 9V3h12v6M6 18H4a1 1 0 0 1-1-1v-6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6a1 1 0 0 1-1 1h-2M6 14h12v7H6z"/></svg>
      <span>Print</span>
    </button>
  </nav>

  <!-- vehicle detail -->
  <div class="overlay" id="sheetOverlay" hidden>
    <aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Vehicle details"></aside>
  </div>

  <!-- who are you -->
  <div class="overlay center" id="whoOverlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="whoTitle">
      <img src="logo.webp" alt="" class="modal-logo">
      <h2 id="whoTitle">Who are you?</h2>
      <p class="muted">Your name is saved with the programs you give or the drivers you inform.</p>
      <div class="who-list" id="whoList"></div>
      <form class="who-other" id="whoForm">
        <input id="whoInput" placeholder="Other name…" autocomplete="off">
        <button class="btn primary" type="submit">OK</button>
      </form>
    </div>
  </div>

  <!-- caller-wise calls (Dashboard tab of the Fleet sheet) -->
  <div class="overlay center" id="callsOverlay" hidden>
    <div class="modal calls-modal" role="dialog" aria-modal="true" aria-labelledby="callsTitle">
      <button type="button" class="modal-x" data-close-calls aria-label="Close">×</button>
      <h2 id="callsTitle">Caller-wise calls</h2>
      <p class="muted" id="callsSub">From the Dashboard sheet</p>
      <div id="callsBody"></div>
    </div>
  </div>

  <datalist id="locList"></datalist>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
